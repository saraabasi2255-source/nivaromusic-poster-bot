name = "nivaromusic-poster-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# همون D1 دیتابیسِ پروژه‌ی بات اصلی (دقیقاً همون id)
[[d1_databases]]
binding = "DB"
database_name = "song_search_db"
database_id = "2e7d2389-a464-4b5c-9374-6b516cff497e"

[vars]
MAIN_BOT_USERNAME = "NivaroMusic_bot"

# این‌ها را اینجا ننویس — همه به صورت Secret/Variable در داشبورد ست شده‌اند:
# POSTER_BOT_TOKEN
# POSTER_WEBHOOK_SECRET
# CHANNEL_ID
# OWNER_ID
# PRIVATE_ARCHIVE_CHANNEL_ID   (= -1003992241448)
