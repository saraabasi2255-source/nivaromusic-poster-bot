name = "nivaromusic-poster-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 👇 همون D1 دیتابیسِ پروژه‌ی بات اصلی رو اینجا وصل کن (باید کاملا یکی باشه،
# نه یه دیتابیس جدید) — database_id رو از wrangler.toml پروژه‌ی اول کپی کن
# یا با `wrangler d1 list` پیداش کن.
[[d1_databases]]
binding = "DB"
database_name = "song_search_db"
database_id = "2e7d2389-a464-4b5c-9374-6b516cff497e"

# متغیرهای غیرمحرمانه (اختیاری، می‌تونی همینجا هم بذاری یا با
# `wrangler secret put` مخفی نگه‌شون داری):
[vars]
MAIN_BOT_USERNAME = "NivaroMusic_bot"
# آیدی عددی تلگرام خودت — فقط همین آیدی اجازه داره با بات حرف بزنه
# (با @userinfobot پیدا کن)
OWNER_ID = "8606397223"

# متغیرهای محرمانه (اینا رو با wrangler secret put ست کن، نه اینجا):
# POSTER_BOT_TOKEN
# POSTER_WEBHOOK_SECRET
