name = "nivaromusic-poster-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 👇 همون D1 دیتابیسِ پروژه‌ی بات اصلی رو اینجا وصل کن (باید کاملا یکی باشه،
# نه یه دیتابیس جدید) — database_id رو از wrangler.toml پروژه‌ی اول کپی کن
# یا با `wrangler d1 list` پیداش کن.
[[d1_databases]]
binding = "DB"
database_name = "song_search_db"
database_id = "2e7d2389-a464-4b5c-9374-6b516cff497e"

# متغیرهای غیرمحرمانه (اختیاری، می‌تونی همینجا هم بذاری یا با
# `wrangler secret put` مخفی نگه‌شون داری):
[vars]
MAIN_BOT_USERNAME = "NivaroMusic_bot"
# آیدی عددیِ کانالی که می‌خوای بات توش پست کنه (بات باید ادمینِ اون کانال باشه،
# با دسترسی «ارسال پیام»). این آیدی معمولا با یه علامت منفی شروع می‌شه،
# مثلا "-1001234567890". برای پیدا کردنش می‌تونی یه پیام از کانال رو به
# @userinfobot فوروارد کنی.
CHANNEL_ID = "-1003312274246"
# آیدی عددی تلگرام خودت — فقط همین آیدی(ها) اجازه دارن با بات حرف بزنن
# (با @userinfobot پیدا کن). اگه چند نفرن، با کاما جدا کن، بدون فاصله یا با فاصله فرقی نداره:
# OWNER_ID = "8606397223,5055650124"
OWNER_ID = "8606397223,5055650124"

# متغیرهای محرمانه (اینا رو با wrangler secret put ست کن، نه اینجا):
# POSTER_BOT_TOKEN
# POSTER_WEBHOOK_SECRET
